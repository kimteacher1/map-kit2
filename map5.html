<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAP LAB - 스마트 배움공책</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        :root {
            --primary: #5DADE2;   
            --bg: #F4F6F7;        
            --panel: #FFFFFF;
            --border: #E8E8E8;
            --radius-box: 24px;   
        }

        * { box-sizing: border-box; }
        body { font-family: 'Jua', sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .hidden { display: none !important; }
        
        .nb-header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); z-index: 10;}
        .btn-outline { background: white; border: 2px solid var(--border); border-radius: 12px; padding: 8px 15px; font-family: 'Jua', sans-serif; cursor: pointer; transition: 0.2s; font-size: 1rem;}
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .btn-primary { background: var(--primary); color: white; border: none; border-radius: 12px; padding: 10px 20px; font-family: 'Jua', sans-serif; cursor: pointer; transition: 0.2s; font-size: 1.1rem;}
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(93, 173, 226, 0.4); }

        .nb-topic { flex: 1; margin: 0 20px; }
        .nb-topic input { width: 100%; padding: 10px; font-size: 1.3rem; border: none; border-bottom: 2px dashed var(--primary); outline: none; font-family: 'Jua', sans-serif; background: transparent; color: #2C3E50; text-align: center;}
        
        .nb-toolbar { display: flex; gap: 10px; background: white; padding: 10px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); align-items: center; justify-content: center; z-index: 5; flex-wrap:wrap;}
        .tool-group { display: flex; align-items: center; gap: 8px; border-right: 2px solid var(--border); padding-right: 15px; }
        .tool-group:last-child { border: none; }
        .tool-btn { background: #F0F3F4; border: none; padding: 10px 15px; border-radius: 12px; cursor: pointer; font-family: 'Jua', sans-serif; transition: 0.2s; font-size: 1.05rem; color: #4A4A4A;}
        .tool-btn.active { background: #D1F2EB; color: #117A65; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }
        
        .btn-import { background: #FEF9E7; border: 1px solid #F1C40F; color: #D4AC0D; font-weight: bold; }
        .btn-import:hover { background: #FCF3CF; }

        .nb-workspace { flex: 1; padding: 20px; display: flex; justify-content: center; overflow: hidden;}
        
        #notebook-canvas-container { position: relative; width: 100%; max-width: 900px; height: 100%; background: #FAFAFA; background-image: radial-gradient(#D5D8DC 1px, transparent 1px); background-size: 25px 25px; border-radius: var(--radius-box); box-shadow: 0 8px 24px rgba(0,0,0,0.06); overflow: hidden;}
        
        #draw-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
        #draw-layer.active { pointer-events: auto; cursor: crosshair; }
        
        .layout-container { width: 100%; height: 100%; padding: 25px; z-index: 2; position: relative; gap: 20px; }
        
        .text-box { width: 100%; height: 100%; border: none; background: transparent; resize: none; font-family: sans-serif; font-size: 1.1rem; line-height: 1.6; outline: none; padding: 15px; border: 2px dashed #BDC3C7; border-radius: 16px; color: #34495E; transition: 0.2s;}
        .text-box:focus { background: rgba(255,255,255,0.9); border-color: var(--primary); }

        .layout-1 { display: flex; flex-direction: column; }
        .layout-1 .top-area { flex: 1; border: 2px dashed #BDC3C7; border-radius: 16px; background: rgba(255,255,255,0.6); display: flex; justify-content: center; align-items: center; color: #95A5A6; font-size: 1.2rem;}
        .layout-1 .bottom-area { flex: 1; }
        
        .layout-2 { display: flex; flex-direction: row; }
        .layout-2 .left-area { flex: 1; }
        .layout-2 .right-area { flex: 1; border: 2px dashed #BDC3C7; border-radius: 16px; background: rgba(255,255,255,0.6); display: flex; justify-content: center; align-items: center; color: #95A5A6; text-align:center;}
        
        .layout-3 { display: grid; grid-template-columns: 30% 1fr; grid-template-rows: 1fr 150px; }
        .layout-3 .left-cue { grid-column: 1; grid-row: 1; border-right: 2px dashed var(--border); padding-right: 15px; }
        .layout-3 .right-note { grid-column: 2; grid-row: 1; padding-left: 15px;}
        .layout-3 .bottom-summary { grid-column: 1 / span 2; grid-row: 2; border-top: 2px dashed var(--border); padding-top: 15px; }

        /* 레이아웃 선택 모달 */
        #layout-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 40px; border-radius: var(--radius-box); max-width: 700px; text-align: center; }
        .modal-box h2 { color: var(--primary); margin-top: 0; font-size: 1.8rem;}
        .layout-options { display: flex; gap: 20px; margin-top: 30px; }
        .layout-card { border: 2px solid var(--border); border-radius: 16px; padding: 20px; cursor: pointer; transition: 0.2s; flex: 1; background: #FDFDFD;}
        .layout-card:hover { border-color: var(--primary); background: #E8F8F5; transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.05);}
        .layout-preview { width: 100%; height: 120px; background: #F0F3F4; margin-bottom: 15px; border-radius: 10px; display: flex; gap: 8px; padding: 8px; }
        
        .p-1 { flex-direction: column; } .p-1 div { flex: 1; background: white; border-radius: 6px; border: 1.5px dashed #BDC3C7;}
        .p-2 { flex-direction: row; } .p-2 div { flex: 1; background: white; border-radius: 6px; border: 1.5px dashed #BDC3C7;}
        .p-3 { display: grid; grid-template-columns: 1fr 2.5fr; grid-template-rows: 2fr 1fr; } .p-3 div { background: white; border-radius: 6px; border: 1.5px dashed #BDC3C7; } .p-3 .b { grid-column: 1 / span 2; }
    </style>
</head>
<body>

    <div id="layout-modal">
        <div class="modal-box">
            <h2>어떤 질문 노트 양식을 사용할까요?</h2>
            <div class="layout-options">
                <div class="layout-card" onclick="selectLayout(1)">
                    <div class="layout-preview p-1"><div></div><div></div></div>
                    <h3>상하 분할형</h3>
                    <p style="font-size:1rem; color:#7F8C8D;">위에는 그림/지도<br>아래는 글쓰기</p>
                </div>
                <div class="layout-card" onclick="selectLayout(2)">
                    <div class="layout-preview p-2"><div></div><div></div></div>
                    <h3>좌우 분할형</h3>
                    <p style="font-size:1rem; color:#7F8C8D;">글과 그림을<br>나란히 나란히</p>
                </div>
                <div class="layout-card" onclick="selectLayout(3)">
                    <div class="layout-preview p-3"><div></div><div></div><div class="b"></div></div>
                    <h3>코넬 노트형</h3>
                    <p style="font-size:1rem; color:#7F8C8D;">단어+내용+요약<br>체계적인 필기</p>
                </div>
            </div>
        </div>
    </div>

    <div class="nb-header">
        <button class="btn-outline" onclick="if(window.parent && window.parent.closeApp) window.parent.closeApp(); else history.back();">◀ 메뉴로</button>
        <div class="nb-topic">
            <input type="text" id="nb-topic-input" placeholder="오늘의 배움 주제를 적어주세요.">
        </div>
        <div style="width: 80px;"></div>
    </div>
    
    <div class="nb-toolbar">
        <div class="tool-group">
            <button class="tool-btn btn-import" onclick="importChatHistory()">💬 대화 불러오기</button>
            <button class="tool-btn" onclick="openLayoutModal()">📑 양식 변경</button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" id="tool-text" onclick="setNotebookMode('text')">⌨️ 글쓰기</button>
            <button class="tool-btn" id="tool-draw" onclick="setNotebookMode('draw')">🖍️ 펜그리기</button>
            <button class="tool-btn" id="tool-erase" onclick="setNotebookMode('erase')">🧽 지우개</button>
            <input type="color" id="draw-color" value="#E74C3C" onchange="if(curNbMode==='draw') setNotebookMode('draw')" style="cursor:pointer; height:35px; border-radius:8px; border:1px solid #BDC3C7;">
            <input type="range" id="draw-size" min="2" max="25" value="5" style="width: 100px; accent-color:#5DADE2;">
            <button class="tool-btn" onclick="clearCanvas()" style="color: #E74C3C; font-weight:bold;">🗑️ 그림 지우기</button>
        </div>
        <button class="btn-primary" onclick="saveNotebook()">📸 완성! 선생님께 제출</button>
    </div>

    <div class="nb-workspace">
        <div id="notebook-canvas-container">
            <canvas id="draw-layer"></canvas>
            <div id="layout-wrapper" class="layout-container layout-1"></div>
        </div>
    </div>

    <script>
        let curNbMode = 'text';
        const cvs = document.getElementById('draw-layer');
        const ctx = cvs.getContext('2d');
        let isDrawing = false;
        let lastX = 0, lastY = 0;

        function openLayoutModal() {
            document.getElementById('layout-modal').classList.remove('hidden');
        }

        function selectLayout(type) {
            document.getElementById('layout-modal').classList.add('hidden');
            const wrapper = document.getElementById('layout-wrapper');
            wrapper.className = `layout-container layout-${type}`;

            if(type === 1) {
                wrapper.innerHTML = `
                    <div class="top-area">이곳에 지도를 그리거나 스티커를 붙여보세요! (펜을 선택하세요)</div>
                    <div class="bottom-area"><textarea class="text-box chat-target" placeholder="여기에 배운 내용을 줄글로 정리해 보세요."></textarea></div>
                `;
            } else if(type === 2) {
                wrapper.innerHTML = `
                    <div class="left-area"><textarea class="text-box chat-target" placeholder="오늘 알게 된 핵심 설명을 여기에 적어보세요."></textarea></div>
                    <div class="right-area">이곳에 지형이나<br>기호를 그려보세요.</div>
                `;
            } else if(type === 3) {
                wrapper.innerHTML = `
                    <div class="left-cue"><textarea class="text-box" placeholder="핵심 단어 / 질문"></textarea></div>
                    <div class="right-note"><textarea class="text-box chat-target" placeholder="상세 필기 및 그리기 영역"></textarea></div>
                    <div class="bottom-summary"><textarea class="text-box" placeholder="오늘 배운 내용 세 줄 요약!"></textarea></div>
                `;
            }

            setTimeout(initCanvas, 100);
            setNotebookMode('text');
        }

        function importChatHistory() {
            const histStr = sessionStorage.getItem('mapbotHistory');
            if(!histStr) { alert("아직 맵봇과 나눈 대화 기록이 없어요."); return; }
            
            const history = JSON.parse(histStr);
            if(history.length <= 1) { alert("아직 맵봇과 나눈 대화가 없어요."); return; }
            
            const targetBox = document.querySelector('.chat-target');
            if(targetBox) {
                const historyText = history.slice(1).map(c => `[${c.role === 'user' ? '나' : '🤖 맵봇'}]\n${c.text}`).join('\n\n');
                targetBox.value += (targetBox.value ? '\n\n---\n\n' : '') + historyText;
                alert("대화 내용이 공책에 쏙 들어왔습니다! 필요한 부분만 예쁘게 수정해보세요.");
            } else {
                alert("글쓰기 영역이 있는 양식을 먼저 선택해주세요.");
            }
        }

        function initCanvas() {
            const container = document.getElementById('notebook-canvas-container');
            cvs.width = container.clientWidth;
            cvs.height = container.clientHeight;
        }

        window.addEventListener('resize', () => { 
            if(document.getElementById('layout-modal').classList.contains('hidden')) initCanvas(); 
        });

        function setNotebookMode(mode) {
            curNbMode = mode;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            if(document.getElementById('tool-' + mode)) document.getElementById('tool-' + mode).classList.add('active');

            if(mode === 'text') {
                cvs.classList.remove('active');
            } else {
                cvs.classList.add('active');
                if(mode === 'draw') {
                    ctx.globalCompositeOperation = 'source-over';
                } else if(mode === 'erase') {
                    ctx.globalCompositeOperation = 'destination-out';
                }
            }
        }

        function clearCanvas() {
            if(confirm("그린 그림을 모두 지울까요? (글씨는 남습니다)")) {
                ctx.clearRect(0, 0, cvs.width, cvs.height);
            }
        }

        function getMousePos(e) {
            const rect = cvs.getBoundingClientRect();
            return {
                x: (e.clientX || e.touches[0].clientX) - rect.left,
                y: (e.clientY || e.touches[0].clientY) - rect.top
            };
        }

        const startDraw = (e) => {
            if(curNbMode === 'text') return;
            isDrawing = true;
            const pos = getMousePos(e);
            lastX = pos.x; lastY = pos.y;
        };

        const draw = (e) => {
            if(!isDrawing) return;
            e.preventDefault();
            const pos = getMousePos(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            
            ctx.lineWidth = document.getElementById('draw-size').value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = document.getElementById('draw-color').value;
            
            ctx.stroke();
            lastX = pos.x; lastY = pos.y;
        };

        const stopDraw = () => { isDrawing = false; };

        cvs.addEventListener('mousedown', startDraw);
        window.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDraw);
        
        cvs.addEventListener('touchstart', startDraw, {passive: false});
        cvs.addEventListener('touchmove', draw, {passive: false});
        window.addEventListener('touchend', stopDraw);

        function saveNotebook() {
            // 깔끔한 스크린샷을 위해 테두리 임시 제거
            document.querySelectorAll('.text-box').forEach(tb => {
                tb.style.border = 'none';
                tb.style.background = 'transparent';
            });
            document.querySelector('.nb-topic input').style.border = 'none';
            cvs.classList.remove('active'); 

            const element = document.getElementById('notebook-canvas-container');
            html2canvas(element, { backgroundColor: '#FAFAFA', scale: 2 }).then(canvas => {
                const url = canvas.toDataURL("image/jpeg", 0.95);
                
                // 원상복구
                document.querySelectorAll('.text-box').forEach(tb => { tb.style.border = '2px dashed #BDC3C7'; });
                document.querySelector('.nb-topic input').style.borderBottom = '2px dashed #5DADE2';
                setNotebookMode(curNbMode);

                if(window.parent && window.parent.handleMapSave) {
                    window.parent.handleMapSave(url, "배움 공책");
                } else {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `스마트_배움공책.jpg`;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                }
            });
        }
    </script>
</body>
</html>
